name: ci

# Push runs on every branch (main included). Same-repo PRs are skipped: their branch is
# already covered by the push run. Fork PRs run here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-go only installs the toolchain; its cache is off, actions/cache below does it.
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      # Stdlib only: there is no module cache. The build cache is keyed on the Go version
      # and go.mod (+ go.sum if one ever appears); a miss restores the newest previous entry.
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: build
        run: make build # CGO_ENABLED=0 -trimpath, all five binaries

      - name: no new dependencies
        run: |
          if [ -f go.sum ] || grep -q '^require' go.mod; then
            echo "stdlib-only is load-bearing: go.mod must have no requires and there must be no go.sum"
            exit 1
          fi

      # Report only: -m never fails the build. Diff escape.txt between runs.
      - name: escape analysis (report)
        run: go build -gcflags='-m' ./... 2> escape.txt || true

      - uses: actions/upload-artifact@v7
        with:
          name: escape-analysis
          path: escape.txt
